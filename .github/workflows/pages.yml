# Builds the public site (site/build.mjs) and publishes it with GitHub Pages: on each push to main,
# each release here (published, or edited, which the release workflow does when it attaches the SD image),
# once a day (for new releases in module repos), and by hand.
name: pages
on:
  push:
    branches: [main]
  release:
    types: [published, edited]
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node site/build.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
